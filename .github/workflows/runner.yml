name: NaNLMind head runner
# Dispatched by NaNLMind/ring.yml. One bounded head shift per run.
on:
  workflow_dispatch:
    inputs:
      op:
        description: selftest | prewarm | headshift | handoff | status
        type: choice
        options: [selftest, prewarm, headshift, handoff, loop, finalize, unlock, status]
        default: selftest
      slot:
        description: runner slot 1..6
        type: string
        default: "6"
      epoch:
        description: logical epoch
        type: string
        default: "0"
      minutes:
        description: shift wall-clock budget (max 300)
        type: string
        default: "300"
      epochs:
        description: epochs for op=loop
        type: string
        default: "200"

permissions:
  contents: read
  id-token: write

concurrency:
  group: nanlm-head-${{ inputs.slot }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_PAT: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_MAIN: ${{ vars.NANLM_MAIN || format('{0}/NaNLMind', github.repository_owner) }}
  DEEPREPO_RAM: ${{ vars.NANLM_RAM || format('{0}/nanlm-ram', github.repository_owner) }}
  DEEPREPO_VRAM: ${{ vars.NANLM_VRAM || format('{0}/nanlm-vram', github.repository_owner) }}
  BSR5_PORTAL_API: ${{ vars.BSR5_PORTAL_API }}
  NANNET_PORTAL_API: ${{ vars.BSR5_PORTAL_API }}
  NANNET_BOOTSTRAP_SLOT: "5"
  DEEPREPO_RAM_BACKEND: github
  DEEPREPO_VRAM_BACKEND: github
  NANLM_CORE: core
  NANLM_USE_CORE: "1"
  NANLM_LOCAL_STATE: ${{ github.workspace }}/state

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout NaNLMind core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NANLM_MAIN || format('{0}/NaNLMind', github.repository_owner) }}
          token: ${{ secrets.DEEPREPO_PAT || github.token }}
          path: core

      - name: Checkout deeprepo engine (tiers, meters, gates)
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/deeprepo', github.repository_owner) }}
          token: ${{ secrets.DEEPREPO_PAT || github.token }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-core.txt

      - name: Install engine Python deps
        run: pip install -r engine/requirements-core.txt

      - name: Authenticate BSR identity with NANNET
        env:
          PORTAL: ${{ env.NANNET_PORTAL_API }}
          SLOT: ${{ env.NANNET_BOOTSTRAP_SLOT }}
          RUN_SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          if int(os.environ["RUN_SLOT"]) != int(os.environ["SLOT"]) + 1:
              raise SystemExit("workflow input slot does not match this BSR repository")
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(url + separator + urllib.parse.urlencode({"audience":"nannet-portal"}), headers={"Authorization":"Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=15) as response:
              oidc = json.load(response)["value"]
          body = json.dumps({"id_token": oidc, "slot": int(os.environ["SLOT"])}).encode()
          req = urllib.request.Request(os.environ["PORTAL"].rstrip("/") + "/v1/bootstrap/oidc", data=body, headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as response:
              result = json.load(response)
          if result.get("role") != "admin" or "training:execute" not in result.get("scopes", []):
              raise SystemExit("NANNET returned an invalid BSR role")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("NANNET_BSR_TOKEN=" + result["token"] + "\n")
          print("NANNET BSR authentication succeeded; token withheld")
          PY

      - name: Build NaNLMind core
        if: ${{ inputs.op == 'selftest' || inputs.op == 'prewarm' || inputs.op == 'headshift' }}
        run: make -C core -j2

      - name: Execute head shift
        run: |
          set -euo pipefail
          PYTHONPATH=engine:core python3 core/runner/nanlm_worker.py \
            --op "${{ inputs.op }}" \
            --slot "${{ inputs.slot }}" \
            --epoch "${{ inputs.epoch }}" \
            --minutes "${{ inputs.minutes }}" \
            --epochs "${{ inputs.epochs }}"

      - name: Summary
        run: |
          {
            echo "## NaNLMind slot ${{ inputs.slot }}"
            echo "op=${{ inputs.op }} epoch=${{ inputs.epoch }}"
            echo '```json'
            cat state/*.json 2>/dev/null | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
